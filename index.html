<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>空白画板</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        /* 左上角加一个极隐蔽的清空按钮 */
        #clearBtn { position: fixed; top: 0; left: 0; width: 50px; height: 50px; background: transparent; border: none; z-index: 10; }
    </style>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <button id="clearBtn"></button>
    <canvas id="board"></canvas>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        
        // 自动铺满全屏
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000000';
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. 连接到免费公共的 MQTT 服务器
        const client = mqtt.connect('wss://broker.emqx.io:8083/mqtt');
        
        // ！！！核心：这是你们专属的秘密频道，你可以把这里改成任何复杂的英文/数字组合
        const secretTopic = "siyuan_magic_pad_99887766"; 

        client.on('connect', () => {
            console.log("魔法线已连接！");
        });

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        // 提取坐标并发送
        function sendDrawData(type, e) {
            const touch = e.touches ? e.touches[0] : e;
            // 计算相对坐标 (0.0 ~ 1.0)，确保在手表小屏幕上画图比例正确
            const relX = touch.clientX / window.innerWidth;
            const relY = touch.clientY / window.innerHeight;
            
            const payload = JSON.stringify({ type: type, x: relX, y: relY });
            client.publish(secretTopic, payload);
            
            return { x: touch.clientX, y: touch.clientY };
        }

        // 画图逻辑
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const pos = sendDrawData('start', e);
            lastX = pos.x; lastY = pos.y;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault(); 
            const pos = sendDrawData('move', e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            lastX = pos.x; lastY = pos.y;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            isDrawing = false;
            client.publish(secretTopic, JSON.stringify({ type: 'end' }));
        });

        // 隐蔽的清空按钮：双击左上角清空画布
        document.getElementById('clearBtn').addEventListener('dblclick', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            client.publish(secretTopic, JSON.stringify({ type: 'clear' })); // 通知手表也清空
        });
    </script>
</body>
</html>
