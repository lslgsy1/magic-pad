<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peek</title>
    <style>
        /* 手表端设置为纯黑背景，画笔为白色 */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #000000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <canvas id="watchBoard"></canvas>

    <script>
        const canvas = document.getElementById('watchBoard');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            // 手表上画笔稍微细一点，颜色必须是白色
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. 连接同一个服务器
        const client = mqtt.connect('wss://broker.emqx.io:8083/mqtt');
        
        // ！！！必须和 pad.html 里的名字一模一样
        const secretTopic = "siyuan_magic_pad_99887766"; 

        client.on('connect', () => {
            // 连接成功后，监听这个频道
            client.subscribe(secretTopic);
        });

        let lastX = 0, lastY = 0;

        // 2. 接收手机传来的数据并实时画出来
        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());
            
            if (data.type === 'clear') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // 把相对坐标还原为手表屏幕的真实坐标
            const realX = data.x * canvas.width;
            const realY = data.y * canvas.height;

            if (data.type === 'start') {
                lastX = realX;
                lastY = realY;
            } else if (data.type === 'move') {
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(realX, realY);
                ctx.stroke();
                
                lastX = realX;
                lastY = realY;
            }
        });
    </script>
</body>
</html>
