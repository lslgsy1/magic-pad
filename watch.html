<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Pad</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { margin: 0; background: #000; touch-action: none; overflow: hidden; }
        canvas { display: block; }
        #toolbar { position: fixed; top: 10px; left: 10px; display: flex; gap: 10px; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #333; color: #fff; font-size: 16px; }
        button.active { background: #007AFF; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="btn-pen" class="active">画笔</button>
        <button id="btn-eraser">橡皮</button>
        <button onclick="clearCanvas()">清空</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topic = 'siyuan_magic_pad_99887766';
        let mode = 'pen'; // 'pen' or 'eraser'

        // 初始化画布大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        // 按钮交互
        document.getElementById('btn-pen').onclick = () => { mode = 'pen'; ctx.strokeStyle = '#fff'; setActive('btn-pen'); };
        document.getElementById('btn-eraser').onclick = () => { mode = 'eraser'; ctx.strokeStyle = '#000'; setActive('btn-eraser'); };
        function setActive(id) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 绘图逻辑
        let drawing = false;
        canvas.onpointerdown = (e) => { drawing = true; draw(e); };
        canvas.onpointermove = (e) => { if (drawing) draw(e); };
        canvas.onpointerup = () => drawing = false;

        function draw(e) {
            const data = { x: e.clientX, y: e.clientY, mode: mode };
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(data.x, data.y);
            // 发送数据给手表
            client.publish(topic, JSON.stringify(data));
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // 接收数据（仅 watch.html 需要这部分逻辑，index.html 可选）
        client.on('connect', () => client.subscribe(topic));
        client.on('message', (t, msg) => {
            const d = JSON.parse(msg.toString());
            ctx.strokeStyle = d.mode === 'eraser' ? '#000' : '#fff';
            ctx.lineTo(d.x, d.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
        });
    </script>
</body>
</html>
